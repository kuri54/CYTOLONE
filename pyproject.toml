[project]
name = "CYTOLONE"
version = "1.1.8"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.6.0",
    "numpy>=2.2.5",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=11.2.1",
    "pyyaml>=6.0.2",
    "transformers>=5.1.0,<6.0.0",
    "torch==2.5.1",
    "gradio>=5.37.0",
    "mlx>=0.27.1",
    "mlx-lm>=0.26.4",
    "mlx-vlm==0.6.8",
    "typer>=0.20.0",
    "typer-slim>=0.20.0",
]

[project.scripts]
cytolone = "CYTOLONE.app:run"
cytolone-config = "CYTOLONE.default_config.config_manager:main"
scale-check = "CYTOLONE.scale_check.scale_checker:run"
download-model = "CYTOLONE.download_models:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["CYTOLONE", "CYTOLONE.*"]

[tool.uv]
package = true
